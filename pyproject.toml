[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jug_hpc"
dynamic = ["version"]
description = "Run Jug on HPC clusters with per-task resource classes"
readme = "README.md"
license = "MIT"
license-files = ["COPYING.MIT"]
authors = [
  {name = "Luis Pedro Coelho", email = "luis@luispedro.org"}
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: System :: Distributed Computing",
  "Intended Audience :: Science/Research",
]

dependencies = [
  "jug>=2.7",
]

[project.urls]
Homepage = "https://github.com/luispedro/jug_hpc"

[project.scripts]
jug-hpc = "jug_hpc.cli:main"

[project.entry-points."jug_hpc.schedulers"]
pbs = "jug_hpc.schedulers.pbs:PBSScheduler"

[dependency-groups]
dev = [
  "hypothesis>=6.170.14",
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
include = ["jug_hpc*"]

[tool.setuptools.dynamic]
version = {attr = "jug_hpc.jug_hpc_version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
